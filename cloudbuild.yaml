steps:
  # Step 0: Capture build timestamp into /workspace/build_time.txt
  - name: "bash"
    script: "date -u +%Y-%m-%dT%H:%M:%SZ > /workspace/build_time.txt"

  # Step 1: Build Docker image — tagged both with commit SHA (immutable) and :latest
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        BUILD_TIME=$(cat /workspace/build_time.txt)
        docker build \
          --build-arg SHORT_SHA=$SHORT_SHA \
          --build-arg BUILD_TIME=$$BUILD_TIME \
          -t gcr.io/unicorn-extermination/github.com/ChiefOfUnicornExtermination/UnicornDeviceBroker:$COMMIT_SHA \
          -t gcr.io/unicorn-extermination/github.com/ChiefOfUnicornExtermination/UnicornDeviceBroker:latest \
          .

  # Step 2: Push both tags to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/unicorn-extermination/github.com/ChiefOfUnicornExtermination/UnicornDeviceBroker"

  # Step 3: Deploy to Cloud Run using :latest so it always picks up the newest image
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "UnicornDeviceBroker"
      - "--image"
      - "gcr.io/unicorn-extermination/github.com/ChiefOfUnicornExtermination/UnicornDeviceBroker:latest"
      - "--region"
      - "asia-northeast1"
      - "--platform"
      - "managed"
      - "--memory"
      - "512Mi"
      - "--min-instances"
      - "1"
      - "--allow-unauthenticated"

# Images to push to Container Registry
images:
  - "gcr.io/unicorn-extermination/github.com/ChiefOfUnicornExtermination/UnicornDeviceBroker:$COMMIT_SHA"
  - "gcr.io/unicorn-extermination/github.com/ChiefOfUnicornExtermination/UnicornDeviceBroker:latest"

# Substitutions (define these in Cloud Build trigger settings if needed)
substitutions:
  _SERVICE: UnicornDeviceBroker
  _REGION: asia-northeast1
