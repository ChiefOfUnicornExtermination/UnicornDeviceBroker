<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Device Control</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .content {
      padding: 30px 20px;
    }
    
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #f0f0f0;
      color: #333;
      cursor: pointer;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .tab-btn.active {
      background: #667eea;
      color: white;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-size: 14px;
      font-weight: 600;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 5px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .btn:hover {
      background: #764ba2;
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    .error {
      color: #d32f2f;
      font-size: 13px;
      margin-top: 5px;
      padding: 8px;
      background: #ffebee;
      border-radius: 3px;
      display: none;
    }
    
    .success {
      color: #388e3c;
      font-size: 13px;
      margin-top: 5px;
      padding: 8px;
      background: #e8f5e9;
      border-radius: 3px;
      display: none;
    }
    
    .dashboard {
      display: none;
    }
    
    .dashboard.active {
      display: block;
    }
    
    .dashboard-header {
      background: #f9f9f9;
      padding: 15px;
      border-bottom: 1px solid #eee;
      margin: -30px -20px 20px -20px;
    }
    
    .dashboard-header p {
      font-size: 13px;
      color: #666;
      margin: 3px 0;
    }
    
    .logout-btn {
      width: 100%;
      padding: 8px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      margin-top: 10px;
    }
    
    .logout-btn:hover {
      background: #d32f2f;
    }
    
    .message {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌈 Smart Device</h1>
      <p>Control your light waver</p>
    </div>
    
    <div class="content">
      <!-- Tabs for Login/Signup -->
      <div id="authTabs">
        <div class="tab-buttons">
          <button class="tab-btn active" onclick="showTab('login')">Login</button>
          <button class="tab-btn" onclick="showTab('signup')">Sign Up</button>
        </div>
        
        <!-- Login Tab -->
        <div id="login" class="tab-content active">
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="login-email">Email</label>
              <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
            <div id="login-error" class="error"></div>
          </form>
        </div>
        
        <!-- Signup Tab -->
        <div id="signup" class="tab-content">
          <form onsubmit="handleSignup(event)">
            <div class="form-group">
              <label for="signup-email">Email</label>
              <input type="email" id="signup-email" required>
            </div>
            <div class="form-group">
              <label for="signup-password">Password (min 6 characters)</label>
              <input type="password" id="signup-password" minlength="6" required>
            </div>
            <div class="form-group">
              <label for="signup-confirm">Confirm Password</label>
              <input type="password" id="signup-confirm" required>
            </div>
            <button type="submit" class="btn">Create Account</button>
            <div id="signup-error" class="error"></div>
            <div id="signup-success" class="success"></div>
          </form>
        </div>
      </div>
      
      <!-- Dashboard (shown after login) -->
      <div id="dashboard" class="dashboard">
        <div class="dashboard-header">
          <p><strong>Welcome!</strong></p>
          <p id="user-email"></p>
          <p style="color: #999; font-size: 12px;">User ID: <span id="user-id"></span></p>
        </div>
        
        <div class="form-group">
          <label for="claim-code">Claim Code</label>
          <input type="text" id="claim-code" placeholder="e.g. ABC-123" maxlength="7">
          <small style="color: #999; display: block; margin-top: 3px;">
            Enter the 6-char code from your device setup page to link it to your account.
          </small>
        </div>
        
        <button class="btn" onclick="claimDevice()">Claim Device</button>
        <div id="claim-error" class="error"></div>
        <div id="claim-success" class="success"></div>
        
        <button class="logout-btn" onclick="logout()">Logout</button>
        
        <div class="message">
          ℹ️ After claiming a device, you'll be able to control your light and motor from this dashboard.
        </div>
      </div>
    </div>
  </div>
  
  <script>
    const API_URL = 'https://api.unicornextermination.info';
    let token = localStorage.getItem('auth_token');
    let userId = localStorage.getItem('user_id');
    let userEmail = localStorage.getItem('user_email');
    
    // Initialize: show dashboard if logged in
    if (token) {
      showDashboard();
    }
    
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      document.querySelector(`[onclick="showTab('${tabName}')"]`).classList.add('active');
    }
    
    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';
      
      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }
        
        // Save token and user info
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user_id', data.user_id);
        localStorage.setItem('user_email', data.email);
        
        token = data.token;
        userId = data.user_id;
        userEmail = data.email;
        
        showDashboard();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }
    
    async function handleSignup(event) {
      event.preventDefault();
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const errorEl = document.getElementById('signup-error');
      const successEl = document.getElementById('signup-success');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Signup failed');
        }
        
        successEl.textContent = '✓ Account created! You can now log in.';
        successEl.style.display = 'block';
        
        // Clear form
        document.getElementById('signup-email').value = '';
        document.getElementById('signup-password').value = '';
        document.getElementById('signup-confirm').value = '';
        
        // Switch to login tab after 2 seconds
        setTimeout(() => showTab('login'), 2000);
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }
    
    function showDashboard() {
      document.getElementById('authTabs').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      document.getElementById('user-email').textContent = userEmail;
      document.getElementById('user-id').textContent = userId;
    }
    
    async function claimDevice() {
      const claimCode = document.getElementById('claim-code').value;
      const errorEl = document.getElementById('claim-error');
      const successEl = document.getElementById('claim-success');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      if (!claimCode) {
        errorEl.textContent = 'Please enter a claim code';
        errorEl.style.display = 'block';
        return;
      }
      
      try {
        const response = await fetch(`${API_URL}/devices/claim`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ claim_code: claimCode })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Claim failed');
        }
        
        successEl.textContent = `✓ Device claimed successfully! Device ID: ${data.device_id}`;
        successEl.style.display = 'block';
        document.getElementById('claim-code').value = '';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    }
    
    function logout() {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('user_id');
      localStorage.removeItem('user_email');
      token = null;
      userId = null;
      userEmail = null;
      
      document.getElementById('authTabs').style.display = 'block';
      document.getElementById('dashboard').classList.remove('active');
      document.getElementById('login-email').value = '';
      document.getElementById('login-password').value = '';
      showTab('login');
    }
  </script>
</body>
</html>
